<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inquiries Agent - Student & Guest Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Top Navbar -->
  <div class="navbar">
    <h1>Inquiries Agent: University Information Portal</h1>
    <div class="user-section">
      <span class="user-badge" id="userBadge">Guest Mode</span>
      <button class="btn-auth" id="authBtn" onclick="window.location.href='login.html'">Student Login</button>
    </div>
  </div>

  <!-- Main Chat Workspace -->
  <div class="container">
    
    <!-- Quick FAQ Chips -->
    <div class="quick-chips">
      <span class="chip-label">Quick Ask:</span>
      <span class="chip" onclick="quickAsk('What are the general university contact details?')">📞 Contact Info</span>
      <span class="chip" onclick="quickAsk('Where can I access the student portal?')">🌐 Student Portal</span>
      <span class="chip" onclick="quickAsk('Where do I pay my tuition fee?')">💳 Tuition & Fees</span>
    </div>

    <!-- Office Escalation Selector -->
    <div class="routing-bar">
      <label for="officeSelect">Target Office (Optional Escalation):</label>
      <select id="officeSelect" class="office-select">
        <option value="">-- Auto-Detect Department --</option>
      </select>
    </div>

    <!-- Chat Stream Container -->
    <div class="chat-box" id="chatBox">
      <div class="message bot">
        Hello! I am your University Information Assistant. Ask me anything about policies, campus events, clearance procedures, or faculty directories.
      </div>
      <div class="typing-indicator" id="typingIndicator">AI Assistant is thinking...</div>
    </div>

    <!-- Input Box Bar -->
    <div class="input-area">
      <input type="text" id="userInput" placeholder="Type your inquiry here..." onkeypress="handleKeyPress(event)">
      <button class="btn-send" onclick="sendMessage()">Send</button>
    </div>
  </div>

<script>
  const API_BASE = "https://inquiries-agent-system.onrender.com";
  let currentUser = JSON.parse(localStorage.getItem('inquiries_user')) || null;

  function getSessionId() {
    if (currentUser) return `student_${currentUser.username}`;
    let guestId = localStorage.getItem('guest_session_id');
    if (!guestId) {
      guestId = "guest_" + Math.random().toString(36).substring(2, 9);
      localStorage.setItem('guest_session_id', guestId);
    }
    return guestId;
  }

  function updateUIState() {
    const badge = document.getElementById('userBadge');
    const authBtn = document.getElementById('authBtn');
    if (currentUser) {
      badge.innerText = `👤 ${currentUser.full_name} (${currentUser.role || 'Student'})`;
      authBtn.innerText = "Logout";
      authBtn.onclick = logout;
    } else {
      badge.innerText = "Guest Mode";
      authBtn.innerText = "Student Login";
      // Ensure click behavior redirects directly to login.html
      authBtn.onclick = function() {
        window.location.href = 'login.html';
      };
    }
  }

  async function loadOffices() {
    const select = document.getElementById("officeSelect");
    if (!select) return;
    try {
      const res = await fetch(`${API_BASE}/offices`);
      if (res.ok) {
        const data = await res.json();
        select.innerHTML = '<option value="">-- Auto-Detect Department --</option>';
        data.offices.forEach(office => {
          const opt = document.createElement("option");
          opt.value = office.id;
          opt.textContent = `${office.name} (${office.code})`;
          select.appendChild(opt);
        });
      }
    } catch (err) {
      console.warn("Could not load offices:", err);
    }
  }

  function logout() {
    currentUser = null;
    localStorage.removeItem('inquiries_user');
    updateUIState();
  }

  function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }
  function quickAsk(q) { 
    document.getElementById('userInput').value = q; 
    sendMessage(); 
  }

  function appendMessage(text, sender, source = '') {
    const chatBox = document.getElementById('chatBox');
    const indicator = document.getElementById('typingIndicator');
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${sender}`;
    
    let content = `<div>${text}</div>`;
    if (source && source !== 'error') {
      content += `<span class="source-tag tag-${source}">Source: ${source}</span>`;
    }
    
    msgDiv.innerHTML = content;
    chatBox.insertBefore(msgDiv, indicator);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function displayUserMessage(text) { appendMessage(text, 'user'); }
  function displayBotMessage(text, source) { appendMessage(text, 'bot', source); }

  async function sendMessage() {
    const inputField = document.getElementById("userInput");
    const input = inputField ? inputField.value.trim() : "";
    const officeSelect = document.getElementById("officeSelect");
    const officeId = officeSelect && officeSelect.value ? parseInt(officeSelect.value) : null;
    const typingIndicator = document.getElementById("typingIndicator");

    if (!input) return;

    displayUserMessage(input);
    if (inputField) inputField.value = "";

    // Show typing state
    typingIndicator.style.display = "block";
    const chatBox = document.getElementById('chatBox');
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
      const response = await fetch(`${API_BASE}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: input,
          session_id: getSessionId(),
          office_id: officeId
        })
      });

      typingIndicator.style.display = "none";

      if (!response.ok) {
        throw new Error(`Server status ${response.status}`);
      }

      const data = await response.json();
      const botText = data.reply || data.message || "No response received.";
      displayBotMessage(botText, data.source);

    } catch (err) {
      typingIndicator.style.display = "none";
      console.error("Chat error:", err);
      displayBotMessage("Error connecting to server.", "error");
    }
  }

  updateUIState();
  loadOffices();
</script>
</body>
</html>
